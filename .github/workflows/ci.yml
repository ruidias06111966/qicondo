name: CI

on:
  push:
    branches: [main]
  pull_request:

# O token do workflow só precisa de ler o código: nenhum destes jobs escreve no
# repositório, comenta num PR ou publica nada. Sem este bloco, o GITHUB_TOKEN
# vem com as permissões por omissão da organização, que são mais largas do que
# o necessário — foi o que o CodeQL apontou.
permissions:
  contents: read

# Um push novo no mesmo ramo cancela a execução anterior, que já não interessa.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Typecheck, lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Testes
        run: bun run test

      - name: Build
        # O build lê VITE_* em tempo de compilação. Aqui usam-se valores de
        # marcador: só interessa que o bundle se gere, e nada nesta etapa contacta
        # o Supabase.
        env:
          VITE_SUPABASE_URL: https://exemplo.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: chave-de-marcador-para-o-build
        run: bun run build

  sql:
    name: Baterias de SQL
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Separado do `verificar` de propósito: são ferramentas diferentes (psql e
    # não bun) e falham por razões diferentes. Num job só, uma falha de SQL
    # aparecia como "o CI falhou" sem dizer de que lado.
    steps:
      - uses: actions/checkout@v4

      # O runner do Ubuntu já traz o PostgreSQL instalado mas parado. O guião
      # arranca uma instância descartável própria, por isso basta o binário.
      - name: Conferir que há PostgreSQL
        run: ls -d /usr/lib/postgresql/*/bin

      - name: Correr as baterias
        # O guião precisa de `su postgres`, porque o initdb recusa correr como
        # root. No runner, o utilizador tem sudo sem palavra-passe.
        run: sudo bash supabase/testes/correr.sh
