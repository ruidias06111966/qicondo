name: CI

on:
  push:
    branches: [main]
  pull_request:

# Um push novo no mesmo ramo cancela a execução anterior, que já não interessa.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Typecheck, lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Testes
        run: bun run test

      - name: Build
        # O build lê VITE_* em tempo de compilação. Aqui usam-se valores de
        # marcador: só interessa que o bundle se gere, e nada nesta etapa contacta
        # o Supabase.
        env:
          VITE_SUPABASE_URL: https://exemplo.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: chave-de-marcador-para-o-build
        run: bun run build
